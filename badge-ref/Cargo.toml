[package]
name = "badge-ref"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Runs a script of the badge-navigation app on exact2's runner: the reference for the C++ target's routes"
publish = false

[dependencies]
contract = { path = "../exact/contract/cli" }
exact-kernel = { path = "../exact/kernel" }
exact-plan = { path = "../exact/plan" }
exact-runner = { path = "../exact/runner" }
serde_json = "=1.0.151"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
