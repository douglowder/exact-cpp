[package]
name = "level-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "The level app's data source: a filtered IMU attitude, announced on the `attitude` topic"

[dependencies]
exact-plan = { path = "../exact/plan" }
exact-runner = { path = "../exact/runner" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
