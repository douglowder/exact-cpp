[package]
name = "plan2cpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Compiles an Exact plan to app-specific C++ over the exact_rt runtime"
publish = false

[dependencies]
contract = { path = "../exact/contract/cli" }
exact-kernel = { path = "../exact/kernel" }
exact-motion = { path = "../exact/motion" }
exact-plan = { path = "../exact/plan" }
exact-runner = { path = "../exact/runner" }
# The versions Exact itself locks, for its text and image hosts.
png = "=0.18.1"
swash = "=0.2.10"
# Extension files: the versions Exact locks.
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
