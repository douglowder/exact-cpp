# Host workspace: plan2cpp, and the apps on Exact's runner (the references the C++ target is
# checked against). Exact is the `exact` submodule beside them.
[workspace]
resolver = "2"
members = ["level-data", "level-tests", "plan2cpp", "badge-ref", "sound-ref"]
# Exact's crates belong to Exact's own workspace (its root manifest gives their edition).
exclude = ["exact"]

# Exact's vendored crates, as Exact's own workspace patches them in.
[patch.crates-io]
taffy = { path = "exact/vendor/taffy" }
